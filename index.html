<style>
:root {
  --bg: #e4e4e9; --panel: #f4f4f7; --panel-2: #ececf0; --fg: #111114; --fg-2: #55555d; --fg-3: #63636b;

  --r: 18px; --r-c: 11px; --ease: cubic-bezier(.22, 1, .36, 1);
  --c-teal: #0071e3; --c-azul: #0a6cde; --c-roxo: #6e4fd8; --c-rosa: #d23c78; --c-laranja: #d4620c; --c-amarelo: #a77a00; --c-verde: #2f8a2f; --c-cinza: #6b7470;
}

  --bg: #000000; --panel: #1c1c1e; --panel-2: #242427; --fg: #f5f5f7; --fg-2: #aeaeb5; --fg-3: #85858c;
  --sep: rgba(84, 84, 88, .55); --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .36);
  --accent: #0a84ff; --accent-2: #409cff; --on-accent: #ffffff; --accent-soft: rgba(10, 132, 255, .16);
  --ok: #32d74b; --bad: #ff5a4f; --warn: #ffb340; --info: #4aa3ff; --shadow: none;
  --glass: rgba(28, 28, 30, .72); --glass-edge: rgba(255, 255, 255, .08);
  --c-teal: #0a84ff; --c-azul: #4aa3ff; --c-roxo: #9b85ff; --c-rosa: #ff6fa5; --c-laranja: #ff9a4a; --c-amarelo: #f2c443; --c-verde: #5fd068; --c-cinza: #9aa5a0;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #000000; --panel: #1c1c1e; --panel-2: #242427; --fg: #f5f5f7; --fg-2: #aeaeb5; --fg-3: #85858c;
  --sep: rgba(84, 84, 88, .55); --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .36);
  --accent: #0a84ff; --accent-2: #409cff; --on-accent: #ffffff; --accent-soft: rgba(10, 132, 255, .16);
  --ok: #32d74b; --bad: #ff5a4f; --warn: #ffb340; --info: #4aa3ff; --shadow: none;
  --glass: rgba(28, 28, 30, .72); --glass-edge: rgba(255, 255, 255, .08);
  --c-teal: #0a84ff; --c-azul: #4aa3ff; --c-roxo: #9b85ff; --c-rosa: #ff6fa5; --c-laranja: #ff9a4a; --c-amarelo: #f2c443; --c-verde: #5fd068; --c-cinza: #9aa5a0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
html, body { overflow-x: clip; max-width: 100%; }
html.trava, html.trava body { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.42; -webkit-font-smoothing: antialiased; min-height: 100dvh; }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
button, input, select, textarea { font: inherit; color: inherit; }
@media (pointer: coarse) { input:not([type="checkbox"]), textarea, select { font-size: 16px !important; } }
a { color: var(--accent); }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* barra de cima */
.top { position: sticky; top: 0; z-index: 30; padding: calc(env(safe-area-inset-top) + 8px) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
  background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); border-bottom: .5px solid var(--sep); }
.top-in { max-width: 64rem; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 44px; }
.top-t { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.marca { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.marca svg { width: 26px; height: 26px; }
.voltar { appearance: none; border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; gap: 2px; padding: 8px 6px 8px 0; cursor: pointer; flex: none; }
.voltar svg { width: 20px; height: 20px; }
.top-nome { font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av-btn { appearance: none; border: 0; width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; cursor: pointer; flex: none; display: grid; place-items: center; }

.wrap { max-width: 64rem; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
h1 { margin: 0; font-family: var(--font-d); font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -.022em; text-wrap: balance; }
h2 { margin: 0; font-family: var(--font-d); font-size: 20px; font-weight: 700; letter-spacing: -.012em; }
h3 { margin: 0; font-size: 16px; font-weight: 650; }
.sub { margin: 4px 0 0; color: var(--fg-2); font-size: 14px; }
.sec { margin-top: 28px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.card { background: var(--panel); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.lista { background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.lista > * + * { border-top: .5px solid var(--sep); }
.vazio { padding: 22px 18px; text-align: center; color: var(--fg-2); }
.vazio b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }
.vazio .btn { margin-top: 12px; }

/* botões */
.btn { appearance: none; border: 0; min-height: 40px; padding: 0 16px; border-radius: 999px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: var(--on-accent); text-decoration: none; transition: transform .15s var(--ease), opacity .15s; }
.btn:hover { opacity: .9; } .btn:active { transform: scale(.97); } .btn:disabled { opacity: .45; cursor: default; }
.btn.soft { background: var(--fill); color: var(--fg); }
.btn.danger { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: 14px; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.claude { background: color-mix(in srgb, #d97757 14%, var(--panel)); color: #c4643f; }
:root[data-theme="dark"] .btn.claude { color: #f0a383; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.claude { color: #f0a383; } }
.btn.claude svg { color: #d97757; }
.link { appearance: none; border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 6px 0; font-size: 16px; }
.link.strong { font-weight: 700; }
.ic-btn { appearance: none; border: 0; width: 36px; height: 36px; border-radius: 50%; background: var(--fill); color: var(--fg-2); display: grid; place-items: center; cursor: pointer; flex: none; }
.ic-btn svg { width: 16px; height: 16px; }
.ic-btn.tx { font-size: 20px; line-height: 1; font-weight: 500; }
.ic-btn:disabled { opacity: .35; cursor: default; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; }

/* pills e etiquetas */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 650; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--fg-2); white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.info { background: color-mix(in srgb, var(--info) 13%, transparent); color: var(--info); }
.pt { width: 10px; height: 10px; border-radius: 50%; background: var(--cor, var(--accent)); flex: none; }
.badge { min-width: 19px; height: 19px; padding: 0 6px; border-radius: 10px; font-size: 11.5px; font-weight: 700; line-height: 19px; text-align: center; background: var(--bad); color: #fff; }

/* início */
.ola { margin: 4px 0 0; }
.proj-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); }
.proj { appearance: none; border: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; display: grid; gap: 12px; transition: transform .18s var(--ease); }
.proj:active { transform: scale(.985); }
.proj-h { display: flex; align-items: center; gap: 10px; }
.proj-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--cor) 16%, transparent); color: var(--cor); font-weight: 800; font-size: 17px; flex: none; }
.proj-n { flex: 1; min-width: 0; }
.proj-n b { display: block; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-st { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.proj-st div { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.proj-st b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-st span { font-size: 12px; color: var(--fg-2); }
.pv-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
.pv-item:hover { background: var(--panel-2); }
.pv-tx { flex: 1; min-width: 0; }
.pv-tx b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.pv-tx span { font-size: 13px; color: var(--fg-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* projeto */
.ph { display: flex; align-items: flex-start; gap: 12px; }
.ph .proj-ic { width: 48px; height: 48px; font-size: 20px; border-radius: 14px; }
.ph-t { flex: 1; min-width: 0; }
.ph-t h1 { font-size: 26px; overflow-wrap: anywhere; }
.ph-m { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 6px; color: var(--fg-2); font-size: 13px; }
.nav-sec { position: sticky; top: calc(env(safe-area-inset-top) + 61px); z-index: 20; margin: 16px -16px 0; padding: 8px 16px; background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8);
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
.nav-sec::-webkit-scrollbar { display: none; }
.nav-sec button { appearance: none; border: 0; flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--fill); color: var(--fg-2); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; position: relative; }
.nav-sec button[aria-current="page"] { background: var(--fg); color: var(--bg); }
.nav-sec .badge { margin-left: 2px; }
.corpo { margin-top: 14px; }
@media (min-width: 64rem) { .nav-sec { margin: 18px 0 0; padding: 8px 0; border-radius: 0; background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; } }

/* visão geral */
.vg-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); }
.fase-seg { margin-top: 10px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 48rem) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { background: var(--panel); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.kpi .k { margin: 0; font-size: 13px; color: var(--fg-2); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi .v { margin: 3px 0 1px; font-family: var(--font-d); font-size: 22px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .v.neg { color: var(--bad); }
.kpi .s { margin: 0; font-size: 12px; color: var(--fg-3); }
.kpi .s.sobe { color: var(--ok); } .kpi .s.desce { color: var(--bad); }
.mini { display: grid; gap: 2px; padding: 10px 0; }
.mini + .mini { border-top: .5px solid var(--sep); }
.mini-h { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.mini-h b { font-weight: 600; overflow-wrap: anywhere; }
.barra { height: 7px; border-radius: 4px; background: var(--fill); overflow: hidden; margin-top: 6px; }
.barra i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .4s var(--ease); }
.barra i.cheio { background: var(--ok); }

/* tarefas */
.st-seg { margin-bottom: 12px; }
.kanban { display: grid; gap: 12px; }
@media (min-width: 56rem) { .kanban { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; } .st-seg { display: none !important; } .col[hidden] { display: block !important; } }
.col-h { display: none; align-items: center; gap: 8px; margin: 0 4px 8px; font-weight: 700; }
@media (min-width: 56rem) { .col-h { display: flex; } }
.col-h .n { color: var(--fg-3); font-weight: 600; }
.tf { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; }
.ck { appearance: none; flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--fill-2); background: none; cursor: pointer; display: grid; place-items: center; }
.ck[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
.ck[aria-pressed="true"]::after { content: ''; width: 9px; height: 5px; border: 2.4px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.ck.meio { border-color: var(--info); }
.ck.meio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--info); }
.tf-tx { appearance: none; border: 0; background: none; padding: 0; text-align: left; flex: 1; min-width: 0; color: inherit; font: inherit; cursor: pointer; display: grid; gap: 5px; }
.tf-tx b { font-weight: 600; overflow-wrap: anywhere; }
.tf.feito .tf-tx b { color: var(--fg-3); text-decoration: line-through; font-weight: 500; }
.cl-box { display: grid; gap: 6px; }
.cl-it { display: flex; align-items: center; gap: 8px; }
.cl-it .ck { margin-top: 0; }
.cl-it .field { flex: 1; min-width: 0; min-height: 40px; }
.cl-it.feito .field { color: var(--fg-3); text-decoration: line-through; }
.cl-prog { margin: 0; font-size: 12.5px; color: var(--fg-2); }
.cl-add { display: grid; gap: 8px; }
.tf-m { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--fg-2); align-items: center; }
.atr { color: var(--bad); font-weight: 650; }

/* campanhas */
.cp { appearance: none; border: 0; width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer; display: grid; gap: 10px; }
.cp:not(.card) { background: none; padding: 0; }
.cp-h { display: flex; align-items: flex-start; gap: 10px; }
.cp-h b { flex: 1; min-width: 0; font-size: 16px; overflow-wrap: anywhere; }
.cp-n { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cp-n div { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.cp-n b { display: block; font-variant-numeric: tabular-nums; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cp-n span { font-size: 12px; color: var(--fg-2); }
.cp-sub { font-size: 13px; color: var(--fg-2); }
.diario { display: grid; gap: 0; }
.di { padding: 10px 0; border-top: .5px solid var(--sep); }
.di:first-child { border-top: 0; }
.di p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.di small { color: var(--fg-3); font-size: 12px; }

/* métricas */
.mnav { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
.mnav h2 { margin-right: auto; }
.graf { margin-top: 12px; }
.graf .k { margin: 0 0 10px; font-size: 13px; color: var(--fg-2); font-weight: 600; }
.bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; height: 140px; align-items: end; }
.bcol { display: grid; grid-template-rows: 1fr auto; height: 100%; gap: 6px; justify-items: center; }
.bcol span { font-size: 12px; color: var(--fg-3); }
.bcol.at span { color: var(--fg); font-weight: 700; }
.bpar { display: flex; align-items: flex-end; gap: 3px; height: 100%; width: 100%; justify-content: center; }
.bpar i { width: min(14px, 40%); border-radius: 4px 4px 0 0; }
.bpar i.f { background: var(--accent); } .bpar i.l { background: var(--ok); } .bpar i.l.neg { background: var(--bad); }
.leg { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--fg-2); }
.leg span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.leg .f::before { background: var(--accent); } .leg .l::before { background: var(--ok); }
.mdef { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: .5px solid var(--sep); }
.mdef:first-child { border-top: 0; }
.mdef span { flex: 1; }

/* caderno */
.busca { display: flex; gap: 8px; margin-bottom: 10px; }
.busca .field { flex: 1; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { appearance: none; border: 0; flex: none; min-height: 32px; padding: 0 12px; border-radius: 999px; background: var(--fill); color: var(--fg-2); font-weight: 600; font-size: 13.5px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.nt { appearance: none; border: 0; width: 100%; text-align: left; background: none; color: inherit; font: inherit; padding: 12px 16px; cursor: pointer; display: grid; gap: 3px; }
.nt:hover { background: var(--panel-2); }
.nt b { font-weight: 650; overflow-wrap: anywhere; }
.nt p { margin: 0; color: var(--fg-2); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nt small { color: var(--fg-3); font-size: 12px; display: flex; gap: 6px; align-items: center; }
textarea.field { min-height: 44px; padding: 10px 12px; line-height: 1.45; resize: vertical; }
.editor { min-height: 46vh !important; }

/* links */
.lk { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.lk-ic { width: 34px; height: 34px; border-radius: 9px; background: var(--fill); display: grid; place-items: center; color: var(--fg-2); flex: none; }
.lk-ic svg { width: 17px; height: 17px; }
.lk a { flex: 1; min-width: 0; text-decoration: none; color: inherit; display: grid; }
.lk a b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lk a span { font-size: 12.5px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* conversa */
.chat { display: flex; flex-direction: column; background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.chat-l { height: 50vh; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 3px; overscroll-behavior: contain; }
.chat-dia { align-self: center; margin: 10px 0 6px; font-size: 12px; font-weight: 600; color: var(--fg-3); background: var(--fill); padding: 3px 10px; border-radius: 10px; }
.msg { align-self: flex-start; max-width: min(80%, 34rem); background: var(--fill); padding: 7px 11px 6px; border-radius: 16px 16px 16px 5px; }
.msg.meu { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-radius: 16px 16px 5px 16px; cursor: pointer; }
.msg-a { margin: 0 0 2px; font-size: 12px; font-weight: 700; color: var(--accent); }
.msg-t { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.38; }
.msg-h { display: block; text-align: right; font-size: 11px; opacity: .7; margin-top: 2px; font-variant-numeric: tabular-nums; }
.chat-f { display: flex; align-items: flex-end; gap: 8px; padding: 10px; border-top: .5px solid var(--sep); }
.chat-f textarea { flex: 1; resize: none; min-height: 42px; max-height: 140px; border-radius: 21px; padding: 10px 14px; }
.chat-f .btn { min-height: 42px; }

/* formulários e janelas */
.field { width: 100%; min-height: 44px; padding: 0 12px; border-radius: var(--r-c); border: 1px solid transparent; background: var(--fill); color: var(--fg); }
.field:focus { outline: none; border-color: var(--accent); background: var(--panel); }
.field::placeholder { color: var(--fg-3); }
.form { display: grid; gap: 12px; }
.row { display: grid; gap: 6px; min-width: 0; }
.row > label, .row > .lbl { font-size: 13px; font-weight: 600; color: var(--fg-2); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; border-radius: 11px; background: var(--fill); }
.seg button { appearance: none; border: 0; min-height: 36px; padding: 0 6px; border-radius: 8px; background: transparent; cursor: pointer; font-weight: 600; color: var(--fg-2); font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg .n { font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.cores { display: flex; flex-wrap: wrap; gap: 10px; }
.cores button { appearance: none; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--cor); cursor: pointer; box-shadow: inset 0 0 0 2px rgba(0,0,0,.06); }
.cores button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--cor); }
.scrim { position: fixed; inset: 0; top: var(--vvt, 0px); bottom: auto; height: var(--vvh, 100%); z-index: 70; background: rgba(0,0,0,.36); display: grid; align-items: end; justify-items: center; overscroll-behavior: contain; animation: fade .2s var(--ease); }
.scrim.sai { animation: fadeo .18s ease forwards; }
.sheet { width: min(100%, 32rem); max-height: calc(var(--vvh, 100dvh) - env(safe-area-inset-top, 0px) - 10px); overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; background: var(--panel); border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); animation: sobe .32s var(--ease); }
@media (min-width: 40rem) { .scrim { align-items: center; } .sheet { border-radius: 22px; max-height: min(88vh, calc(var(--vvh, 100dvh) - 40px)); padding-bottom: 20px; } }
.grabber-z { margin: -10px -18px 0; padding: 10px 18px 0; touch-action: none; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 0 auto 8px; }
.sheet-h { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 0 -18px 12px; padding: 0 18px 6px; position: sticky; top: -10px; z-index: 3; background: var(--panel); }
.sheet-h h3 { text-align: center; font-size: 17px; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-h .l { justify-self: start; } .sheet-h .r { justify-self: end; }
@keyframes sobe { from { transform: translateY(40px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeo { to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .scrim, .sheet { animation: none; } }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 90; background: color-mix(in srgb, var(--fg) 88%, transparent); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.codigo { font: 700 30px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em; text-align: center; margin: 4px 0; padding: 14px; border-radius: 12px; background: var(--fill); user-select: all; }
.mb { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.mb span { flex: 1; }
.av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }

/* entrada */
.entrar { max-width: 24rem; margin: 10vh auto 0; display: grid; gap: 14px; }
.entrar .marca { font-size: 24px; justify-content: center; }
.entrar .marca svg { width: 40px; height: 40px; }
.entrar .sub { text-align: center; }
.erro { color: var(--bad); font-size: 14px; margin: 0; }
.load { padding: 40px 0; text-align: center; color: var(--fg-2); }

/* conhecimento */
.sb-cartao { appearance: none; border: 0; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--panel)), var(--panel) 70%); transition: transform .3s cubic-bezier(.34,1.4,.64,1); }
.sb-cartao:active { transform: scale(.98); }
@media (hover: hover) and (pointer: fine) { .sb-cartao:hover { transform: translateY(-2px); } }
.sb-ic { width: 46px; height: 46px; border-radius: 14px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.sb-ic svg { width: 24px; height: 24px; }
.sb-tx { flex: 1; min-width: 0; display: grid; gap: 2px; }
.sb-tx b { font-size: 17px; }
.sb-tx span { font-size: 13.5px; color: var(--fg-2); }
.sb-it { appearance: none; border: 0; width: 100%; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; }
.sb-it:hover { background: var(--panel-2); }
.sb-ic2 { width: 36px; height: 36px; border-radius: 10px; background: var(--fill); color: var(--fg-2); display: grid; place-items: center; flex: none; }
.sb-it.novo .sb-ic2 { background: var(--accent-soft); color: var(--accent); }
.sb-ic2 svg { width: 18px; height: 18px; }
.sb-tx2 { flex: 1; min-width: 0; display: grid; gap: 3px; }
.sb-tx2 b { font-weight: 650; overflow-wrap: anywhere; }
.sb-tx2 p { margin: 0; color: var(--fg-2); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sb-tx2 small { color: var(--fg-3); font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sb-novo { flex: none; font-size: 11.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
.sb-corpo { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
.sb-coms { display: flex; flex-direction: column; gap: 4px; }
.sb-cf { padding: 0; border: 0; }
.lbl { margin: 6px 0 0; font-size: 13px; font-weight: 600; color: var(--fg-2); }

/* personalização */
.av, .proj-ic, .av-in, .esc-av { overflow: hidden; }
.av.com-img, .proj-ic.com-img, .av-in.com-img, .esc-av.com-img { background: var(--fill); padding: 0; }
.com-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.proj-ic.com-ic, .av.com-ic, .av-in.com-ic, .esc-av.com-ic { background: var(--cor); color: #fff; }
.com-ic svg { width: 58%; height: 58%; }
.av-btn { padding: 0; overflow: hidden; }
.av-in { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--cor) 18%, transparent); color: var(--cor); font-weight: 700; }
.av { background: color-mix(in srgb, var(--cor, var(--accent)) 18%, transparent); color: var(--cor, var(--accent)); }
.pf-linha { appearance: none; border: 0; background: var(--fill); border-radius: 14px; padding: 10px 12px; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.pf-linha .av { width: 44px; height: 44px; font-size: 18px; }
.pf-t { flex: 1; min-width: 0; display: grid; } .pf-t span { font-size: 13px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; }
.ola-box.com-banner { position: relative; padding: 22px 18px 18px; border-radius: var(--r); overflow: hidden; color: #fff; isolation: isolate; margin: 0 0 4px; }
.ola-box.com-banner::before { content: ""; position: absolute; inset: 0; z-index: -2; background: var(--bn); }
.ola-box.com-banner::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.45)); }
.ola-box.com-banner .sub { color: rgba(255,255,255,.85); }
.proj { position: relative; overflow: hidden; }
.proj.com-bn { padding-top: 64px; }
.proj-bn { position: absolute; left: 0; right: 0; top: 0; height: 52px; }
.proj.com-bn .proj-ic { margin-top: -30px; box-shadow: 0 0 0 3px var(--panel); }
.proj.com-bn .proj-ic:not(.com-ic):not(.com-img) { background-color: var(--panel); background-image: linear-gradient(color-mix(in srgb, var(--cor) 16%, transparent), color-mix(in srgb, var(--cor) 16%, transparent)); }
.ph.com-bn { position: relative; padding: 76px 14px 14px; border-radius: var(--r); overflow: hidden; isolation: isolate; color: #fff; }
.ph.com-bn::before { content: ""; position: absolute; inset: 0; z-index: -2; background: var(--bn); }
.ph.com-bn::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(0,0,0,.55)); }
.ph.com-bn .ph-m { color: rgba(255,255,255,.88); }
.ph.com-bn .ic-btn { background: rgba(255,255,255,.22); color: #fff; }
.ph.com-bn .proj-ic { box-shadow: 0 0 0 3px rgba(255,255,255,.7); }
.proj-ic.com-ic { background: var(--cor); }
.esc-banners { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.esc-banners .esc-op { height: 40px; border-radius: 10px; }
.esc-fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; }
.esc-fotos .esc-op { height: 44px; border-radius: 12px; background: var(--fill); display: grid; place-items: center; color: var(--fg-2); }
.esc-op { appearance: none; border: 0; cursor: pointer; padding: 0; box-shadow: inset 0 0 0 1px var(--sep); transition: transform .25s cubic-bezier(.34,1.4,.64,1); }
.esc-op:active { transform: scale(.92); }
.esc-op[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
.esc-ic svg { width: 22px; height: 22px; display: block; } .esc-ini { font-weight: 700; }
.esc-prev-b { height: 84px; border-radius: 14px; display: grid; place-items: center; color: var(--fg-3); font-size: 13px; background: var(--fill); }
.esc-prev-f { display: flex; justify-content: center; }
.esc-av { width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; font-size: 28px; font-weight: 700; background: color-mix(in srgb, var(--cor) 18%, transparent); color: var(--cor); }
.cor-livre { position: relative; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; background: conic-gradient(#ff3b30, #ff9500, #ffcc00, #34c759, #00c7be, #0071e3, #5e5ce6, #ff2d55, #ff3b30); box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
.cor-livre[style*="--cor"] { background: var(--cor); }
.cor-livre input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.cores button[data-v] { width: 34px; height: 34px; }

/* ===== visual igual ao do Painel da Vida ===== */
body { overscroll-behavior-y: contain; }
.wrap { padding-top: calc(env(safe-area-inset-top) + 14px); }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; margin-bottom: 16px; }
.head-l { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 auto; padding-left: 58px; }
.head-t { min-width: 0; }
.date { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--fg-2); }
.head h1 { margin: 2px 0 0; font-size: clamp(30px, 5vw, 38px); line-height: 1.08; letter-spacing: -.025em; overflow-wrap: anywhere; }
.menu-btn { appearance: none; position: fixed; z-index: 34; top: calc(env(safe-area-inset-top) + 12px); left: calc(env(safe-area-inset-left) + 14px); width: 44px; height: 44px; border-radius: 50%; color: var(--fg); cursor: pointer; display: grid; place-items: center;
  background: color-mix(in srgb, var(--panel) 72%, transparent); border: .5px solid rgba(255,255,255,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 20px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.12);
  -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8); transition: transform .25s cubic-bezier(.34,1.4,.64,1); }
.menu-btn svg { width: 20px; height: 20px; }
.menu-btn:active { transform: scale(.9); }
.head .av-btn { width: 44px; height: 44px; align-self: center; box-shadow: 0 0 0 1px var(--sep); }
.tabs { display: none; }
@media (min-width: 48.01rem) {
  .menu-btn { position: absolute; top: calc(env(safe-area-inset-top) + 18px); left: max(16px, calc((100vw - 64rem) / 2 + 16px)); }
  .tabs { display: flex; width: 100%; gap: 4px; padding: 4px; border-radius: 16px; background: color-mix(in srgb, var(--panel) 80%, transparent); box-shadow: var(--shadow), inset 0 0 0 1px var(--sep); }
  .tab { appearance: none; border: 0; background: none; flex: 1; min-height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--fg-2); font: inherit; font-weight: 600; cursor: pointer; position: relative; }
  .tab svg { width: 18px; height: 18px; }
  .tab[aria-current="page"] { background: var(--fg); color: var(--bg); }
  .tab .badge { margin-left: 2px; }
}
.bnav { display: none; }
@media (max-width: 48rem) {
  .wrap { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
  .bnav:not([hidden]) { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; display: flex; align-items: flex-end;
    background: color-mix(in srgb, var(--panel) 86%, transparent); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid var(--sep); padding: 5px max(6px, env(safe-area-inset-right, 0px)) calc(5px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .bnav button { appearance: none; border: 0; background: none; flex: 1 1 0; min-width: 0; min-height: 50px; display: grid; justify-items: center; align-content: center; gap: 3px; padding: 0; color: var(--fg-3); font-size: 10.5px; font-weight: 600; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; transition: transform .25s cubic-bezier(.34,1.4,.64,1); }
  .bnav button:active { transform: scale(.9); }
  .bnav button > svg { width: 24px; height: 24px; }
  .bnav button[aria-current="page"] { color: var(--accent); }
  .bnav .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; line-height: 18px; font-size: 11px; padding: 0 5px; }
  .bnav button.casa { flex: 0 0 72px; align-content: start; }
  .bnav button.casa i { width: 58px; height: 58px; margin-top: -26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 38%, transparent), 0 0 0 5px var(--bg); }
  .bnav button.casa i svg { width: 27px; height: 27px; }
  .nav-sec { top: calc(env(safe-area-inset-top) + 8px); transition: padding-left .2s ease; }
  .nav-sec.presa { padding-left: 70px; }
}
.lead { margin: 0; font-size: 17px; line-height: 1.45; color: var(--fg-2); }
.lead b { color: var(--fg); background: linear-gradient(90deg, var(--accent), #5ac8fa); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ola-box.com-banner .lead, .ola-box.com-banner .lead b { color: #fff; -webkit-text-fill-color: #fff; background: none; }
.ph-n { display: block; font-size: 15px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
/* gaveta */
.gaveta { position: fixed; inset: 0; z-index: 60; }
.gv-fundo { position: absolute; inset: 0; background: rgba(0,0,0,.35); opacity: 0; transition: opacity .22s; }
.gv-painel { position: absolute; top: 0; bottom: 0; left: 0; width: min(84vw, 320px); background: var(--panel); box-shadow: 8px 0 32px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 8px; padding: calc(env(safe-area-inset-top) + 22px) 14px calc(env(safe-area-inset-bottom) + 16px); transform: translateX(-102%); transition: transform .24s cubic-bezier(.2,.8,.2,1); overflow-y: auto; }
.gaveta.aberta .gv-fundo { opacity: 1; } .gaveta.aberta .gv-painel { transform: none; }
.gv-perfil { appearance: none; border: 0; background: var(--fill); border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.gv-perfil .av { width: 46px; height: 46px; font-size: 18px; }
.gv-lista { display: grid; gap: 2px; margin-top: 6px; }
.gv-item { appearance: none; border: 0; background: none; border-radius: 12px; min-height: 46px; padding: 0 12px; display: flex; align-items: center; gap: 12px; font: inherit; font-weight: 600; color: var(--fg); cursor: pointer; text-align: left; }
.gv-item svg { width: 20px; height: 20px; color: var(--fg-2); flex: none; }
.gv-item .badge { margin-left: auto; }
.gv-sep { height: .5px; background: var(--sep); margin: 6px 8px; }
/* tarefas e conversas */
.grp-h { appearance: none; border: 0; background: none; font: inherit; color: inherit; display: flex; align-items: center; gap: 10px; margin: 0 0 8px; padding: 0; cursor: pointer; }
.grp-h b { font-size: 17px; } .grp-h .n { color: var(--fg-3); font-weight: 600; }
.proj-ic.mini { width: 30px; height: 30px; border-radius: 9px; font-size: 14px; }
.cv-it { appearance: none; border: 0; width: 100%; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.cv-tx { flex: 1; min-width: 0; display: grid; gap: 2px; }
.cv-l1 { display: flex; justify-content: space-between; gap: 8px; } .cv-l1 small { color: var(--fg-3); font-size: 12px; flex: none; }
.cv-l2 { color: var(--fg-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv-it.novo .cv-l2 { color: var(--fg); font-weight: 600; }
/* puxar para atualizar */
.ptr { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) - 44px); z-index: 60; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: var(--panel); color: var(--accent); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.18), inset 0 0 0 1px var(--sep); opacity: 0; pointer-events: none; }
.ptr svg { width: 20px; height: 20px; transition: transform .2s; } .ptr.pronto svg { transform: rotate(180deg); } .ptr.girando svg { animation: ptrGira .7s linear infinite; }
@keyframes ptrGira { to { transform: rotate(360deg); } }
/* vidro e pulinho, como no Painel */
:root { --lg-top: rgba(255,255,255,.62); --lg-bot: rgba(255,255,255,.22); --lg-borda: rgba(255,255,255,.75); --lg-sombra: 0 8px 22px rgba(20,20,40,.10); --pop: cubic-bezier(.34,1.4,.64,1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --lg-top: rgba(255,255,255,.13); --lg-bot: rgba(255,255,255,.04); --lg-borda: rgba(255,255,255,.16); --lg-sombra: 0 8px 22px rgba(0,0,0,.35); } }
:root[data-theme="dark"] { --lg-top: rgba(255,255,255,.13); --lg-bot: rgba(255,255,255,.04); --lg-borda: rgba(255,255,255,.16); --lg-sombra: 0 8px 22px rgba(0,0,0,.35); }
:is(.pv-item, .tf, .nt, .lk, .sb-it, .cv-it, .gv-item, .mini) { position: relative; isolation: isolate; transition: transform .32s var(--pop); -webkit-tap-highlight-color: transparent; }

    l.forEach((n) => { const b = el('button', 'nt'); b.type = 'button'; b.addEventListener('click', () => openNota(p.id, n)); b.appendChild(el('b', '', n.titulo || 'Sem título')); if (n.texto) b.appendChild(el('p', '', n.texto)); const sm = el('small'); sm.append(el('span', 'pill', n.tag || 'Outro'), document.createTextNode(`${dm(diaDe(n.updated_at))} · ${(n.editado_por || n.autor) === S.uid ? 'você' : nomeDe(p.id, n.editado_por || n.autor)}`)); b.appendChild(sm); lista.appendChild(b); });
    w.appendChild(lista); return w;
  }

  /* ---------- links ---------- */
  const urlOk = (u) => { try { const x = new URL(u); return x.protocol === 'https:' || x.protocol === 'http:'; } catch (e) { return false; } };
  function openLink(pid, k) {

    sheet(novo ? 'Novo link' : 'Link', [t, u, el('p', 'sub', 'Não guarde senhas aqui. Use só links (Drive, Figma, site, painel de anúncios).')], () => {

      const ti = $('#lk-tit').value.trim() || new URL(url).hostname.replace(/^www\./, '');

    }, extra);
  }
  function secLinks(p) {
    const w = el('div'); const d = docsDe(p.id).links;
    const h = el('div', 'sec-h'); h.appendChild(el('h2', '', 'Links')); const nv = el('button', 'btn sm'); nv.type = 'button'; nv.innerHTML = IC.mais + '<span>Novo link</span>'; nv.addEventListener('click', () => openLink(p.id, null)); h.appendChild(nv); w.appendChild(h);
    const l = el('div', 'lista');

      if (!urlOk(k.url)) return;
      const r = el('div', 'lk'); const ic = el('span', 'lk-ic'); ic.innerHTML = IC.link;
      const a = el('a'); a.href = k.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.append(el('b', '', k.titulo), el('span', '', new URL(k.url).hostname.replace(/^www\./, '')));

    });
    w.appendChild(l); return w;
  }

  /* ---------- conversa ---------- */
  function chatAltura() {
    const l = $('#chat-l'); const f = $('.chat-f'); if (!l || !f) return; const vv = window.visualViewport; const alt = vv ? vv.height : innerHeight;
    const bn = $('#bnav'); const bh = bn && !bn.hidden && getComputedStyle(bn).display !== 'none' ? bn.offsetHeight : 0;
    l.style.height = Math.max(200, Math.round(alt - l.getBoundingClientRect().top - f.offsetHeight - 16 - bh)) + 'px';
  }
  ['resize', 'orientationchange'].forEach((e) => window.addEventListener(e, () => requestAnimationFrame(chatAltura)));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => requestAnimationFrame(() => { chatAltura(); const l = $('#chat-l'); if (l && document.activeElement && document.activeElement.id === 'chat-txt') l.scrollTop = l.scrollHeight; }));
  let fimPend = -1;
  function secConversa(p) {
    const w = el('div', 'chat'); const ms = docsDe(p.id).mural.slice().sort((a, b) => String(a.criado_em).localeCompare(String(b.criado_em))).slice(-400);
    const l = el('div', 'chat-l'); l.id = 'chat-l'; l.setAttribute('role', 'log'); l.setAttribute('aria-live', 'polite'); l.setAttribute('aria-label', 'Conversa do projeto');

    ms.forEach((m) => {
      const d = diaDe(m.criado_em); if (d !== diaA) { diaA = d; autA = ''; l.appendChild(el('p', 'chat-dia', d === HOJE() ? 'Hoje' : d === addDays(HOJE(), -1) ? 'Ontem' : wd(d) + ', ' + dm(d))); }
      const meu = m.autor === S.uid; const b = el('div', 'msg' + (meu ? ' meu' : ''));
      if (!meu && autA !== m.autor) b.appendChild(el('p', 'msg-a', nomeDe(p.id, m.autor))); autA = m.autor;
      if (m.anexo && /^https:\/\/lpnzcxxxywaknghxcpah\.supabase\.co\/storage\/v1\/object\/public\/neg-imagens\//.test(m.anexo.url || '')) b.appendChild(anexoEl(m.anexo));
      if (m.texto) b.appendChild(el('p', 'msg-t', m.texto));
      const hh = el('span', 'msg-h', hora(m.criado_em));
      if (meu) { const vs = quemViu(p.id, m); const ok = membrosDe(p.id).length > 1 && vs.length && vs.length === membrosDe(p.id).length - 1; const tk = el('span', 'tick' + (ok ? ' lido' : '')); tk.innerHTML = ok ? '<svg viewBox="0 0 18 12" aria-hidden="true"><path d="M1 6.5 4.5 10 11 2.5M7 9.5l.5.5L14.5 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '<svg viewBox="0 0 18 12" aria-hidden="true"><path d="M4 6.5 7.5 10 14 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'; tk.setAttribute('aria-label', ok ? `Vista por ${vs.map((x) => x.nome).join(' e ')}` : 'Enviada, ainda não vista'); tk.title = tk.getAttribute('aria-label'); hh.appendChild(tk); }
      b.appendChild(hh);
      if (meu) { b.tabIndex = 0; b.setAttribute('role', 'button'); b.setAttribute('aria-label', 'Sua mensagem: ' + (m.texto || '') + '. Toque para apagar'); const ap = () => { const x = el('button', 'btn danger', 'Apagar mensagem'); x.type = 'button'; x.addEventListener('click', () => { fecharSheet(); apagar(p.id, 'mural', m.id); }); sheet('Mensagem', [el('p', 'sub', m.texto || ''), x], null); }; b.addEventListener('click', ap); b.addEventListener('keydown', (e) => { if (e.key === 'Enter') ap(); }); }
      l.appendChild(b);
    });
    const f = el('form', 'chat-f'); const ta = el('textarea', 'field'); ta.id = 'chat-txt'; ta.rows = 1; ta.maxLength = 3000; ta.placeholder = 'Mensagem'; ta.setAttribute('aria-label', 'Mensagem');
    const aj = () => { ta.style.height = 'auto'; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; }; ta.addEventListener('input', aj);
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer: fine)').matches) { e.preventDefault(); f.requestSubmit(); } });
    const env = el('button', 'btn', 'Enviar'); env.type = 'submit';
    const fi = el('input'); fi.type = 'file'; fi.hidden = true; fi.accept = 'image/*,application/pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip,audio/*,video/mp4,video/quicktime';
    const clip = el('button', 'ic-btn clip'); clip.type = 'button'; clip.setAttribute('aria-label', 'Mandar anexo'); clip.innerHTML = svg('M20 11.5 12.2 19.3a5 5 0 0 1-7.1-7.1l8-8a3.4 3.4 0 0 1 4.8 4.8l-8 8a1.7 1.7 0 0 1-2.4-2.4l7.4-7.4', 1.9);
    clip.addEventListener('click', () => fi.click());
    fi.addEventListener('change', async () => { const fl = fi.files && fi.files[0]; fi.value = ''; if (!fl) return; clip.disabled = true; clip.classList.add('enviando'); toast('Enviando anexo…');
      const ax = await enviarAnexo(fl); clip.disabled = false; clip.classList.remove('enviando'); if (!ax) return;
      const t = ta.value.trim(); ta.value = ''; aj(); salvar(p.id, 'mural', novoId(), { texto: t.slice(0, 3000), anexo: ax }, true); requestAnimationFrame(() => { const x = $('#chat-l'); if (x) x.scrollTop = x.scrollHeight; }); });
    f.append(clip, fi, ta, env);
    f.addEventListener('submit', (e) => { e.preventDefault(); const t = ta.value.trim(); if (!t) return; ta.value = ''; aj(); salvar(p.id, 'mural', novoId(), { texto: t.slice(0, 3000) }, true); requestAnimationFrame(() => { const x = $('#chat-l'); if (x) x.scrollTop = x.scrollHeight; }); ta.focus(); });
    w.append(l, f);
    requestAnimationFrame(() => { chatAltura(); if (fimPend !== ms.length) { fimPend = ms.length; l.scrollTop = l.scrollHeight; } });
    return w;
  }

  // anexos do chat: imagens ficam leves (reduzidas no aparelho); outros arquivos vão como estão, até 15 MB
  const tamTxt = (n) => (n > 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
  async function enviarAnexo(fl) {
    if (fl.size > 15 * 1048576) { toast('Arquivo grande demais (máximo 15 MB)'); return null; }
    let blob = fl, tipo = fl.type || 'application/octet-stream', nome = (fl.name || 'arquivo').replace(/[^\w.\-À-ú ]+/g, '').slice(-80) || 'arquivo';
    const img = /^image\/(jpeg|png|webp)$/.test(tipo);
    if (img) { try { const bmp = await createImageBitmap(fl); const esc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)); const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * esc); cv.height = Math.round(bmp.height * esc); cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height); const b2 = await new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.85)); if (b2) { blob = b2; tipo = 'image/jpeg'; nome = nome.replace(/\.\w+$/, '') + '.jpg'; } } catch (e) { /* manda como está */ } }
    const caminho = `${S.uid}/chat/${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}-${nome.replace(/\s+/g, '-')}`;
    const { error } = await S.sb.storage.from('neg-imagens').upload(caminho, blob, { contentType: tipo, upsert: false });
    if (error) { toast(/mime|type/i.test(error.message || '') ? 'Esse tipo de arquivo não é aceito' : 'Não consegui enviar o anexo'); return null; }
    return { url: S.sb.storage.from('neg-imagens').getPublicUrl(caminho).data.publicUrl, nome, tipo: /^image\//.test(tipo) ? 'img' : 'arq', mime: tipo, tam: blob.size };
  }
  function anexoEl(a) {
    if (a.tipo === 'img') { const l = el('a', 'anx-img'); l.href = a.url; l.target = '_blank'; l.rel = 'noopener noreferrer'; l.addEventListener('click', (e) => e.stopPropagation()); const im = el('img'); im.src = a.url; im.alt = a.nome || 'Imagem'; im.loading = 'lazy'; l.appendChild(im); return l; }
    const l = el('a', 'anx-arq'); l.href = a.url; l.target = '_blank'; l.rel = 'noopener noreferrer'; l.addEventListener('click', (e) => e.stopPropagation());
    const ic = el('span', 'anx-ic', (String(a.nome || '').split('.').pop() || 'arq').slice(0, 4).toUpperCase()); const tx = el('span', 'anx-tx'); tx.append(el('b', '', a.nome || 'Arquivo'), el('small', '', `${tamTxt(a.tam || 0)} · toque para abrir`)); l.append(ic, tx); return l;
  }

  /* ---------- entrada ---------- */
  function telaEntrar(msg) {
    $('#menu-btn').hidden = true; $('#bnav').hidden = true;
    const w = el('form', 'entrar'); const m = el('div', 'marca'); m.innerHTML = IC.marca; m.appendChild(el('span', '', 'Negócios'));
    w.append(m, el('p', 'sub', 'Use a mesma conta do Painel da Vida.'));
    const e = field('E-mail', 'in-email', { type: 'email', autocomplete: 'email', inputmode: 'email', required: 'required' });
    const s = field('Senha', 'in-senha', { type: 'password', autocomplete: 'current-password', required: 'required' });
    const erro = el('p', 'erro', msg || ''); erro.setAttribute('role', 'alert');
    const b = el('button', 'btn', 'Entrar'); b.type = 'submit';
    const esq = el('a', 'link', 'Esqueci a senha ou não tenho conta'); esq.href = 'https://leofonseca30102009.github.io/Painel-da-Vida/'; esq.style.textAlign = 'center';
    w.append(e, s, erro, b, esq);
    w.addEventListener('submit', async (ev) => { ev.preventDefault(); b.disabled = true; erro.textContent = ''; const { error } = await S.sb.auth.signInWithPassword({ email: $('#in-email').value.trim(), password: $('#in-senha').value }); b.disabled = false; if (error) { erro.textContent = 'E-mail ou senha não conferem.'; return; } location.reload(); });
    $('#app').replaceChildren(w);
  }

  /* ---------- início do app ---------- */
  async function iniciar() {
    const cfg = window.PAINEL_CONFIG; if (!window.supabase || !cfg) { $('#app').replaceChildren(el('p', 'load', 'Não consegui carregar. Confira a internet e recarregue.')); return; }
    S.sb = window.supabase.createClient(cfg.url, cfg.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
    const { data } = await S.sb.auth.getSession(); const ses = data && data.session;
    if (!ses) { telaEntrar(); return; }
    S.uid = ses.user.id; S.email = ses.user.email || '';
    try { const { data: pf } = await S.sb.from('docs').select('data').eq('colecao', 'config').eq('id', 'perfil').maybeSingle(); if (pf && pf.data && pf.data.nome) S.nome = pf.data.nome; } catch (e) { /* sem perfil */ }
    render(); await carregar(); ouvir();
    S.sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.reload(); });
  }
  (() => {
    const ind = document.createElement('div'); ind.className = 'ptr'; ind.setAttribute('aria-hidden', 'true');
    ind.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5v13M6.5 12.5L12 18l5.5-5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    document.body.appendChild(ind); const LIM = 70; let y0 = null, x0 = 0, dy = 0, ativo = false;
    const pode = (t) => window.scrollY <= 0 && !document.documentElement.classList.contains('trava') && !(t.closest && t.closest('.sheet, .scrim, .gaveta, .chat-l, .nav-sec, .bnav, .chips, input, textarea, select'));
    const solta = () => { ind.style.transition = 'transform .25s ease, opacity .2s ease'; ind.style.transform = 'translateY(0)'; ind.style.opacity = '0'; ind.classList.remove('pronto', 'girando'); setTimeout(() => { ind.style.transition = ''; }, 260); };
    addEventListener('touchstart', (e) => { if (e.touches.length !== 1 || !S.uid || !pode(e.target)) { y0 = null; return; } y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; ativo = false; }, { passive: true });
    addEventListener('touchmove', (e) => { if (y0 === null) return; const d = e.touches[0].clientY - y0; const dx = Math.abs(e.touches[0].clientX - x0);
      if (!ativo) { if (d > 10 && d > dx * 1.5 && window.scrollY <= 0) ativo = true; else if (d < -4 || dx > 14) { y0 = null; return; } else return; }
      dy = Math.min(130, d * 0.5); ind.style.transform = `translateY(${dy + 44}px)`; ind.style.opacity = String(Math.min(1, dy / LIM)); ind.classList.toggle('pronto', dy >= LIM); if (e.cancelable) e.preventDefault(); }, { passive: false });
    addEventListener('touchend', async () => { if (y0 === null) return; y0 = null; const ok = ativo && dy >= LIM; ativo = false; if (!ok) { solta(); return; }
      ind.classList.remove('pronto'); ind.classList.add('girando'); ind.style.transition = 'transform .2s ease'; ind.style.transform = 'translateY(96px)'; await carregar(); toast('Atualizado'); solta(); });
  })();
  addEventListener('scroll', () => { const n = document.querySelector('.nav-sec'); if (!n) return; n.classList.toggle('presa', n.getBoundingClientRect().top <= 20 && window.scrollY > 40); }, { passive: true });
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { /* sem service worker */ }));
  iniciar();
})();
